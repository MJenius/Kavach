version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://bh5jk75t74.execute-api.ap-south-1.amazonaws.com/dev/api}"
        - export VITE_API_URL="${VITE_API_URL:-$VITE_API_BASE_URL}"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
